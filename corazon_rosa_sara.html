<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Te Amo Sara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --rose: #ff3fa6;
        --rose-light: #ffc2e6;
        --gold: #f4d3a8;
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }

    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at center, #180a1e 0%, #0a0410 55%, #030106 100%);
    }

    canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
    }

    .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(3,1,6,0.55) 85%, rgba(3,1,6,0.9) 100%);
    }

    .stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        pointer-events: none;
    }

    #loveText {
        font-family: 'Dancing Script', cursive;
        font-weight: 700;
        color: var(--rose-light);
        text-shadow:
            0 0 8px rgba(255,255,255,0.55),
            0 0 22px var(--rose),
            0 0 46px var(--rose),
            0 0 90px rgba(255, 63, 166, 0.55);
        font-size: clamp(30px, 8vw, 78px);
        opacity: 0;
        white-space: nowrap;
        letter-spacing: 1px;
        transform: translateY(14px) scale(0.92);
        filter: blur(4px);
        transition: opacity 1.6s cubic-bezier(.19,1,.22,1), transform 1.6s cubic-bezier(.19,1,.22,1), filter 1.6s cubic-bezier(.19,1,.22,1);
    }

    #loveText.show {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
        animation: breathe 4.5s ease-in-out 1.8s infinite;
    }

    @keyframes breathe {
        0%, 100% { text-shadow:
            0 0 8px rgba(255,255,255,0.55),
            0 0 22px var(--rose),
            0 0 46px var(--rose),
            0 0 90px rgba(255, 63, 166, 0.55); }
        50% { text-shadow:
            0 0 12px rgba(255,255,255,0.75),
            0 0 30px var(--rose),
            0 0 60px var(--rose),
            0 0 120px rgba(255, 63, 166, 0.7); }
    }

    #flourish {
        margin-top: 6px;
        width: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        opacity: 0;
        transition: width 1.4s cubic-bezier(.19,1,.22,1) 0.4s, opacity 1s ease 0.4s;
    }

    #flourish.show {
        width: min(60vw, 340px);
        opacity: 0.85;
    }
</style>
</head>
<body>

<canvas id="heartCanvas"></canvas>
<div class="vignette"></div>
<div class="stage">
    <div id="loveText">Te Amo Sara</div>
    <div id="flourish"></div>
</div>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const glowCanvas = document.createElement('canvas');
    const glowCtx = glowCanvas.getContext('2d');
    const loveTextEl = document.getElementById('loveText');
    const flourishEl = document.getElementById('flourish');

    let width, height, dpr;
    let particles = [];
    let sparkles = [];

    const PARTICLE_COUNT = 15000;
    const PINK_HUES = [332, 322, 344, 312, 352];

    const startTime = Date.now();
    const OUTLINE_DURATION = 3200;
    const FILL_DURATION = 1900;
    const TOTAL_INTRO = 5600;
    const TEXT_DELAY = 700;

    let textShown = false;
    let flashStart = null;

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = glowCanvas.width = width * dpr;
        canvas.height = glowCanvas.height = height * dpr;
        canvas.style.width = glowCanvas.style.width = width + 'px';
        canvas.style.height = glowCanvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        glowCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        init();
    }
    window.addEventListener('resize', resize);

    function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

    function getHeartPosition(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return { x, y };
    }

    function randomPinkColor() {
        const hue = PINK_HUES[Math.floor(Math.random() * PINK_HUES.length)];
        const light = 62 + Math.random() * 22;
        return `hsl(${hue}, 100%, ${light}%)`;
    }

    class Sparkle {
        constructor() { this.reset(); }
        reset() {
            this.t = Math.random() * Math.PI * 2;
            this.life = 0;
            this.maxLife = 35 + Math.random() * 45;
            this.size = Math.random() * 1.8 + 0.8;
            this.active = false;
        }
        draw(g, screenScale, beatScale) {
            if (!this.active) {
                if (Math.random() < 0.015) { this.active = true; this.life = 0; }
                return;
            }
            this.life++;
            if (this.life > this.maxLife) { this.reset(); return; }
            const rawPos = getHeartPosition(this.t);
            const scale = screenScale * beatScale * (0.3 + Math.random() * 0.9);
            const x = width / 2 + rawPos.x * scale;
            const y = height / 2 + rawPos.y * scale;
            const alpha = Math.sin((this.life / this.maxLife) * Math.PI);

            g.save();
            g.globalAlpha = alpha;
            g.fillStyle = "#fff6fb";
            g.beginPath();
            g.arc(x, y, this.size, 0, Math.PI * 2);
            g.fill();
            g.restore();
        }
    }

    class Particle {
        constructor() {
            this.t = Math.random() * Math.PI * 2;
            this.isEdge = Math.random() > 0.955;

            if (this.isEdge) {
                this.baseScale = 1.0;
                this.driftSpeed = 0;
                this.offsetScale = (Math.random() - 0.5) * 3.2;
            } else {
                this.baseScale = Math.pow(Math.random(), 0.42);
                this.driftSpeed = 0.0009 + Math.random() * 0.0035;
                this.offsetScale = 0;
            }

            this.size = Math.random() * 1.4 + 0.5;
            this.color = randomPinkColor();
            this.x = width / 2;
            this.y = height / 2;
            this.justReset = false;
            this.revealDelay = Math.random();
            this.twinklePhase = Math.random() * Math.PI * 2;
            this.twinkleSpeed = 0.015 + Math.random() * 0.04;
        }

        draw(g, beatScale, elapsed) {
            let alpha = 1;

            if (elapsed < OUTLINE_DURATION) {
                if (!this.isEdge) return;
                const progress = easeOutCubic(elapsed / OUTLINE_DURATION);
                if (Math.abs(this.t - Math.PI) / Math.PI > progress) return;
            } else if (elapsed < TOTAL_INTRO) {
                if (!this.isEdge) {
                    const fp = (elapsed - OUTLINE_DURATION) / FILL_DURATION;
                    if (this.revealDelay > fp) return;
                    alpha = Math.min(1, (fp - this.revealDelay) * 3);
                }
            }

            if (!this.isEdge && elapsed > OUTLINE_DURATION) {
                this.baseScale -= this.driftSpeed;
                if (this.baseScale <= 0) { this.baseScale = 1.0; this.justReset = true; }
            }

            const rawPos = getHeartPosition(this.t);
            const screenScale = Math.min(width, height) / 45;
            let appliedScale = this.isEdge ? this.baseScale * beatScale : this.baseScale;
            const currentScale = screenScale * appliedScale;

            let thicknessExpansion = this.isEdge ? this.offsetScale * beatScale : 0;
            let targetX = width / 2 + (rawPos.x * currentScale) + (Math.cos(this.t) * thicknessExpansion);
            let targetY = height / 2 + (rawPos.y * currentScale) + (Math.sin(this.t) * thicknessExpansion);

            if (this.justReset) {
                this.x = targetX; this.y = targetY; this.justReset = false;
            } else {
                this.x += (targetX - this.x) * 0.1;
                this.y += (targetY - this.y) * 0.1;
            }

            this.twinklePhase += this.twinkleSpeed;
            const twinkle = 0.82 + 0.18 * Math.sin(this.twinklePhase);

            g.beginPath();
            g.globalAlpha = alpha * twinkle;
            g.fillStyle = this.color;
            g.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            g.fill();
            g.globalAlpha = 1.0;
        }
    }

    function init() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
        sparkles = [];
        for (let i = 0; i < 90; i++) sparkles.push(new Sparkle());
    }

    function drawVerticalLine(g, elapsedAfterIntro) {
        const growSpeed = 1400;
        const currentLength = elapsedAfterIntro * growSpeed;
        const maxTop = height * 0.38;
        const maxBottom = height * 0.48;
        const lenTop = Math.min(maxTop, currentLength / 2);
        const lenBottom = Math.min(maxBottom, currentLength / 2 * 1.5);

        g.save();
        g.lineWidth = 1.6 + Math.random() * 1.6;
        const gradient = g.createLinearGradient(0, height / 2 - lenTop, 0, height / 2 + lenBottom);
        gradient.addColorStop(0, 'rgba(255, 63, 166, 0)');
        gradient.addColorStop(0.2, 'rgba(255, 63, 166, 0.85)');
        gradient.addColorStop(0.42, 'rgba(255, 214, 235, 1)');
        gradient.addColorStop(0.8, 'rgba(255, 63, 166, 0.85)');
        gradient.addColorStop(1, 'rgba(255, 63, 166, 0)');
        g.strokeStyle = gradient;
        g.beginPath();
        g.moveTo(width / 2, height / 2 - lenTop);
        g.lineTo(width / 2, height / 2 + lenBottom);
        g.stroke();
        g.restore();

        return lenTop >= maxTop && lenBottom >= maxBottom;
    }

    function drawFlash(g, elapsed) {
        if (flashStart === null) return;
        const t = (elapsed - flashStart) / 500;
        if (t > 1) return;
        const alpha = (1 - t) * 0.5;
        const r = Math.min(width, height) * (0.15 + t * 0.55);
        const grad = g.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, r);
        grad.addColorStop(0, `rgba(255,235,246,${alpha})`);
        grad.addColorStop(0.4, `rgba(255,120,190,${alpha * 0.5})`);
        grad.addColorStop(1, 'rgba(255,120,190,0)');
        g.save();
        g.fillStyle = grad;
        g.fillRect(0, 0, width, height);
        g.restore();
    }

    let time = 0;
    function animate() {
        const now = Date.now();
        const elapsed = now - startTime;

        glowCtx.fillStyle = 'rgba(8, 2, 14, 0.30)';
        glowCtx.fillRect(0, 0, width, height);

        const beatStrength = 0.07;
        const p = Math.pow(Math.sin(time), 30);
        let beatScale = 1;
        if (elapsed >= TOTAL_INTRO) beatScale = 1 + (p * beatStrength);

        particles.forEach(pt => pt.draw(glowCtx, beatScale, elapsed));

        let lineFinished = false;
        if (elapsed >= TOTAL_INTRO) {
            const timeAfterIntro = (elapsed - TOTAL_INTRO) / 1000;
            lineFinished = drawVerticalLine(glowCtx, timeAfterIntro);
            const screenScale = Math.min(width, height) / 45;
            sparkles.forEach(s => s.draw(glowCtx, screenScale, beatScale));
        }

        if (lineFinished && !textShown) {
            textShown = true;
            flashStart = elapsed;
            setTimeout(() => {
                loveTextEl.classList.add('show');
                flourishEl.classList.add('show');
            }, TEXT_DELAY);
        }
        drawFlash(glowCtx, elapsed);

        // Compose: soft bloom pass + sharp pass
        ctx.clearRect(0, 0, width, height);
        ctx.save();
        ctx.filter = 'blur(10px)';
        ctx.globalAlpha = 0.5;
        ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(glowCanvas, 0, 0, glowCanvas.width, glowCanvas.height, 0, 0, width, height);
        ctx.restore();

        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(glowCanvas, 0, 0, glowCanvas.width, glowCanvas.height, 0, 0, width, height);

        time += 0.05;
        requestAnimationFrame(animate);
    }

    resize();
    animate();
</script>
</body>
</html>
